spring.config.import=optional:file:.env[.properties]

spring.application.name=clyvo-challenge3

# datasource
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Dados de conexao com o banco Oracle (vem de variaveis de ambiente: .env local ou App Settings no Azure)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configuracao para mostrar o SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Hibernate nao cria/altera o schema -- quem cria e o Flyway
spring.jpa.hibernate.ddl-auto=none

# Flyway assume a responsabilidade de criar/popular o schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# baseline 0: se o seu schema na FIAP ja tiver tabelas de outras materias,
# o Flyway ainda assim roda V1, V2 e V3 (com o padrao 1 ele pularia a V1)
spring.flyway.baseline-version=0
spring.flyway.validate-migration-naming=true
spring.flyway.locations=classpath:db/migration
# tabela de controle do Flyway com nome proprio, para nao misturar com o outro trabalho da Clyvo
spring.flyway.table=FLYWAY_HISTORY_CLYVOJ
